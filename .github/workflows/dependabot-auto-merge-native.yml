# This uses pull_request because the App secrets are mirrored into the Dependabot store.
# pull_request_target is deliberately not used; the workflow runs safely with the mirrored secrets.
# The GitHub App performs the merge so the code-owner ruleset bypass applies.
# main-requires-ci is not bypassed, so green validate-manifests remains mandatory.

name: Dependabot auto-merge (native)

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  auto-merge:
    name: auto-merge
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Fetch Dependabot metadata
        uses: dependabot/fetch-metadata@v2
        id: meta
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      - name: Enable auto-merge for non-major updates
        if: steps.meta.outputs.update-type != 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          echo "update-type: ${{ steps.meta.outputs.update-type }}"
          if ! gh pr merge --auto --merge "$PR_URL"; then
            echo "Auto-merge arming failed; attempting direct merge (PR may already be mergeable)."
            gh pr merge --merge "$PR_URL"
          fi

      - name: Comment on skipped major updates
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          gh pr comment "$PR_URL" --body "Auto-merge skipped: this is a **major** version update (\`${{ steps.meta.outputs.update-type }}\`) and requires manual review."

# This uses pull_request because the App secrets are mirrored into the Dependabot store.
# pull_request_target is deliberately not used; the workflow runs safely with the mirrored secrets.
# The GitHub App performs the merge so the code-owner ruleset bypass applies.
# main-requires-ci is not bypassed, so green validate-manifests remains mandatory.

name: Dependabot auto-merge (native)

on:
  pull_request:
    types: [opened, reopened, synchronize]

permissions:
  contents: read

jobs:
  auto-merge:
    name: auto-merge
    if: github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Mint App token
        uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Fetch Dependabot metadata
        uses: dependabot/fetch-metadata@v2
        id: meta
        with:
          github-token: ${{ steps.app-token.outputs.token }}

      # Positive allowlist (fail-closed): auto-merge ONLY when the update type is
      # explicitly patch or minor. Anything else -- major, or an EMPTY update-type
      # (which fetch-metadata returns for grouped PRs and on internal failure) --
      # falls through to the comment step and is left for manual review.
      - name: Enable auto-merge for patch and minor updates
        if: |
          steps.meta.outputs.update-type == 'version-update:semver-patch' ||
          steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          echo "update-type: $UPDATE_TYPE -- eligible for auto-merge"
          if ! gh pr merge --auto --merge "$PR_URL"; then
            echo "Auto-merge arming failed; attempting direct merge (PR may already be mergeable)."
            gh pr merge --merge "$PR_URL"
          fi

      - name: Comment on updates that were not auto-merged
        if: |
          steps.meta.outputs.update-type != 'version-update:semver-patch' &&
          steps.meta.outputs.update-type != 'version-update:semver-minor'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          PR_URL: ${{ github.event.pull_request.html_url }}
          UPDATE_TYPE: ${{ steps.meta.outputs.update-type }}
        run: |
          label="${UPDATE_TYPE:-unknown (grouped PR or metadata unavailable)}"
          echo "update-type: $label -- NOT auto-merging"
          gh pr comment "$PR_URL" --body "Auto-merge skipped: update type \`$label\` is not an allowed patch/minor update. This PR requires manual review."

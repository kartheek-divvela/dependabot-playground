name: Dependabot auto-merge

# Enable hourly schedule: - cron: '17 * * * *' after a live run has been verified.
on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'List eligible PRs without merging them'
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge
  cancel-in-progress: false

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/create-github-app-token@v2
        id: app-token
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}

      - name: Sweep Dependabot PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run == true && 'true' || 'false' }}
        run: python .github/scripts/dependabot_automerge.py

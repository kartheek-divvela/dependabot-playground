name: Dependabot auto-merge sweeper

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: List eligible PRs without merging
        type: boolean
        default: true
        required: true
      include_majors:
        description: Also merge major version bumps
        type: boolean
        default: false
        required: true
  # Enable after a live run is verified:
  # schedule:
  #   - cron: '17 * * * *'

permissions:
  contents: read

concurrency:
  group: dependabot-auto-merge

jobs:
  auto-merge:
    name: auto-merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mint App token
        id: app-token
        uses: actions/create-github-app-token@v2
        with:
          app-id: ${{ secrets.AUTOMERGE_APP_ID }}
          private-key: ${{ secrets.AUTOMERGE_APP_PRIVATE_KEY }}
      - name: Sweep Dependabot PRs
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          DRY_RUN: ${{ inputs.dry_run }}
          INCLUDE_MAJORS: ${{ inputs.include_majors }}
        run: python3 .github/scripts/dependabot_automerge.py
